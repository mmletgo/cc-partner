<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFDF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-pain"
        class="scene"
        data-composition-id="01-pain"
        data-composition-src="compositions/frames/01-pain.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-workbench"
        class="scene"
        data-composition-id="02-workbench"
        data-composition-src="compositions/frames/02-workbench.html"
        data-start="2.8"
        data-duration="5.7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-mobile"
        class="scene"
        data-composition-id="03-mobile"
        data-composition-src="compositions/frames/03-mobile.html"
        data-start="8"
        data-duration="4"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-pain", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 2.8);
        tl.fromTo("#el-02-workbench", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 2.8);
        tl.to("#el-02-workbench", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.fromTo("#el-03-mobile", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.to({}, { duration: 12 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
