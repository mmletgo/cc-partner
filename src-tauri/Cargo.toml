[package]
name = "app"
version = "0.9.3"
description = "cc-partner desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# 存在多个 [[bin]] target（GUI app + cc-partner-backend CLI + Agent CLI）时，
# 显式声明默认运行 GUI 主进程，避免 `cargo run` / `tauri dev` / `tauri build`
# 报 "could not determine which binary to run"。
# - package name 保持 `app`（Cargo 主二进制名），Tauri 通过 tauri.conf.json
#   `mainBinaryName: "cc-partner"` 在打包时把 GUI 可执行文件命名为 cc-partner，
#   与 productName / 防火墙指引 / macOS 授权显示名一致。
# - Agent CLI cargo bin 固定为 `cc-partner-cli`，避免与 GUI mainBinaryName 在
#   target/release 下同名覆盖；release 产物仍上传为 `cc-partner-cli-<matrix>`。
# CLI：`cargo run --bin cc-partner-backend` / `cargo run --bin cc-partner-cli`。
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cc-partner-backend"
path = "src/bin/cc-partner-backend.rs"

# Agent-first 控制 CLI（独立 artifact；不进入 Tauri externalBin）
# 二进制名必须与 GUI mainBinaryName（cc-partner）区分，防止 tauri build 重命名覆盖。
[[bin]]
name = "cc-partner-cli"
path = "src/bin/cc-partner.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
csv = "1.4"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
hostname = "0.4"
if-addrs = "0.13"
toml_edit = "0.25"
# M3 P2P 网络层：axum HTTP server（供对端调用）+ reqwest peer client + mdns-sd 发现 + tower（axum 服务依赖）
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
mdns-sd = "0.11"
regex = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# GitHub Trending 首页：解析 github.com/trending HTML（GitHub 无官方 Trending JSON API）
scraper = "0.27"
# M5 文件传输：tokio-util 提供 CancellationToken（每块发送前检查取消标志）
tokio-util = { version = "0.7", features = ["rt"] }
# M5 文件传输：SHA256 完整性校验（对照 Python hashlib.sha256）
sha2 = "0.10"
# M6 区域截图：xcap 跨平台抓屏（物理像素）、arboard 直接写剪贴板图片、image 裁剪/PNG 编码、base64 给前端背景
xcap = "0.4"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", features = ["png", "jpeg"] }
base64 = "0.22"
# M8 自动更新：tauri-plugin-updater 负责 check/download/install（签名校验 + 三平台替换），
# tauri-plugin-process 提供 app.restart() 安装后重启
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Workbench Claude session 搜索：notify 监听 ~/.claude/projects/<encoded-cwd>/ 变化增量更新索引
notify = "6"
# M10 健康提醒:device_query(macOS 键鼠状态查询)、rdev(Windows/Linux 全局事件)、
# active-win-pos-rs(活动窗口标题/进程名)、notification(系统通知)、autostart(开机自启)
device_query = "1.1"
rdev = "0.5"
active-win-pos-rs = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# Claude Code Assets: portable LAN bundles + safe directory walking
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"
# Workbench: cross-platform PTY for interactive Claude Code sessions
portable-pty = "0.9.0"
serde_yaml = "0.9.34"
fs4 = { version = "1", features = ["sync"] }
# A5 Browser Verification: CDP client for managed chrome-headless-shell
chromiumoxide = { version = "=0.7.0", default-features = false, features = ["tokio-runtime"] }
# A7 Agent-first CLI：固定 4.5.32 derive 兼容项目 MSRV 1.77.2
clap = { version = "=4.5.32", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# integration smoke（pty_smoke）需要直接使用 portable-pty / libc，不能只依赖 lib 再导出。
portable-pty = "0.9.0"
libc = "0.2"
# backend_cli_smoke harness：解析 CLI status / control JSON。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# backup_restore_smoke：手工构造 ZIP + SHA256 校验坏/好包。
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# dev profile 调优：缩短每次 Rust 变更的重链 + .app 复制时间。
# macOS dev 经 scripts/macos-dev-cargo-runner.sh 每次变更都 cargo build → 重组
# ~/Applications/cc-partner (Dev).app（copyFile ≈191M GUI binary）→ 重启全应用；
# 顶层 libapp_lib.a ≈1.3G、app ≈191M，瓶颈在 debug 信息体积。
# - debug = "line-tables-only"：自身代码只留行表（panic 栈仍能定位文件/行号），去变量级信息；
# - package."*" debug = false：依赖 crate 完全不生成 debug info（收益大头）。
# 不设 split-debuginfo：macOS 在有 debug info 时默认已是 "unpacked"，显式写无效。
# 代价：lldb 单步看不到局部变量值。需要完整调试时用 cargo build --profile debugging
# （产物在 target/debugging/，首次会独立全量编译一次）。
# 注意：改 profile 会让 fingerprint 失效，下次 ./start.sh dev 会全量重编依赖一次（一次性）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 完整变量级调试档（按需）：继承 dev 的其余设置，仅恢复完整 debug info。
[profile.debugging]
inherits = "dev"
debug = true
