# Build & Release (Tauri) — 三段式打包发版 CI（弃用 tauri-apps/tauri-action）
#
# 为什么弃用 tauri-action？
#   tauri-apps/tauri-action 有个上游 bug：只要任一平台缺 updater 的 .sig 签名文件，
#   它就打印 "Signature not found, skipping upload" 并整体跳过 latest.json 的生成上传。
#   结果 GitHub Release 上没有 latest.json（返回 404），应用内 updater 检查更新时报
#   `error sending request for url`。固定到上游 dev commit 同样无效，必须等上游修复。
#
# 新方案（参考 cc-switch 项目）：
#   1. 用项目锁定的 tauri CLI 直接跑 `tauri build`（配合 tauri.conf.json 的
#      bundle.createUpdaterArtifacts: true，让 Tauri 自动产出 .app.tar.gz / .exe 及其
#      .sig 签名文件），不再依赖 tauri-action 的产物收集逻辑。
#   2. 每个 matrix 平台把 updater 产物（+.sig）和安装包收集到 release-assets/，通过
#      workflow artifact 汇总。
#   3. 用独立的 bash 脚本扫描所有 .sig、按文件名匹配平台，生成 latest.json 再上传到
#      Release —— 只要某个平台产出了 .sig 就会进 latest.json，互不影响，彻底绕开 bug。
#
# 三个 job 的职责：
#   - build                  : 按 matrix（macOS aarch64 / macOS x86_64 / Windows / Linux x64 /
#                              Linux arm64）各自 tauri build，收集产物到 release-assets/。
#   - publish-release        : 合并所有平台的 release-assets/，上传到 GitHub Release。
#   - assemble-latest-json   : 从 Release 拉取全部 .sig，生成并上传 latest.json 供 updater 用。
#
# 注：前端在 web/ 子目录（用 npm 不是 pnpm），tauri 项目在 src-tauri/ 子目录。tauri CLI
# 经 `cd web && npm ci` 安装到 web/node_modules，从仓库根目录调用 web/node_modules/.bin/tauri
# （与本地 ./start.sh 一致）。macOS 保持 ad-hoc 签名（signingIdentity: "-"），不做 Apple
# 公证/notarization；Windows updater 用 nsis（.exe）。

name: Build & Release (Tauri)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一 tag 多次推送时取消旧的运行，避免重复发版 / Release 资产冲突
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # job 1: 各平台构建 + 收集产物
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.matrix_id }})
    strategy:
      # 单个平台失败不阻断其他平台
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（M 系列）
          - matrix_id: macos-aarch64
            platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          # macOS Intel
          - matrix_id: macos-x86_64
            platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          # Windows x86_64（nsis + msi；updater 用 nsis 的 .exe）
          - matrix_id: windows-x86_64
            platform: 'windows-latest'
            target: ''
          # Linux x86_64（AppImage + deb + rpm）
          - matrix_id: linux-x86_64
            platform: 'ubuntu-22.04'
            target: ''
          # Linux arm64（aarch64；GitHub 原生 arm64 runner）
          - matrix_id: linux-aarch64
            platform: 'ubuntu-24.04-arm'
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 按目标 target 装（aarch64/x86_64）；其他平台 target 为空，用默认 host target
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          # 按 平台+target+browser-runtime 版本隔离缓存
          shared-key: ${{ matrix.platform }}-${{ matrix.target }}-browser-runtime-150.0.7871.114

      - name: Cache managed browser runtime zip
        uses: actions/cache@v4
        with:
          path: .browser-runtime-cache
          key: browser-runtime-150.0.7871.114-${{ hashFiles('scripts/browser-runtime-lock.json') }}-${{ matrix.platform }}

      - name: Install Linux system dependencies (webkit2gtk-4.1 等 Tauri 运行/构建依赖)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies (web/)
        # 安装前端依赖 + 项目锁定的 @tauri-apps/cli（写入 web/node_modules/.bin/tauri）
        run: cd web && npm ci

      - name: Prepare Tauri signing key
        # 把 TAURI_SIGNING_PRIVATE_KEY secret 原样注入 GITHUB_ENV 供 tauri build 签名用。
        # secret 应存 minisign 私钥文件的原始内容（单行 base64，如 `dW50cnVzdGVk...`）。
        # tauri signer 会自动识别这个格式，不要做任何解码/再编码——否则破坏格式。
        # 同时始终注入 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（无密码时为空字符串）——
        # tauri signer 即使私钥无密码也需要这个 env 存在才不报 "incorrect password"。
        # secret 为空或缺失直接 fail（没有签名就没法生成 latest.json 的 signature）。
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret 为空或不存在" >&2
            exit 1
          fi
          # 原样注入（只去除换行，保留 base64 内容）。secret 应是 `gh secret set < key` 的文件内容
          KEY_CONTENT=$(printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_CONTENT" >> "$GITHUB_ENV"
          # 始终注入 PASSWORD（无密码私钥也需要这个 env 存在，值为空字符串）
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "✅ Tauri signing key prepared"

      # ── 各平台构建 ────────────────────────────────────────────────────────
      # 用项目锁定的 tauri CLI（web/node_modules/.bin/tauri，与本地 ./start.sh 一致）。
      # 在仓库根目录运行：tauri CLI 会自动定位 src-tauri/tauri.conf.json，并由其中的
      # beforeBuildCommand（cd ../web && npm run build）触发前端构建。
      - name: Prepare backend sidecar externalBin
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            node scripts/prepare-tauri-sidecar.mjs --target "${{ matrix.target }}"
          else
            node scripts/prepare-tauri-sidecar.mjs
          fi

      # A7：独立 Agent CLI 产物（不进入 Tauri externalBin / binaries/）
      - name: Build standalone agent CLI (cc-partner)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked --release --bin cc-partner --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"
            BIN="src-tauri/target/${{ matrix.target }}/release/cc-partner"
          else
            cargo build --locked --release --bin cc-partner --manifest-path src-tauri/Cargo.toml
            BIN="src-tauri/target/release/cc-partner"
          fi
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          ARCH_TAG="${{ matrix.matrix_id }}"
          OUT="release-assets/cc-partner-cli-${ARCH_TAG}"
          if [[ "$BIN" == *.exe ]]; then OUT="${OUT}.exe"; fi
          cp "$BIN" "$OUT"
          echo "=== agent CLI artifact ==="
          ls -la "$OUT"

      - name: Build Tauri App (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: web/node_modules/.bin/tauri build --target ${{ matrix.target }}

      - name: Build Tauri App (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        # 只打 nsis：updater 与正式分发均使用 *_x64-setup.exe。
        # targets=all 会额外跑 WiX MSI；在打包 managed Chromium（browser-runtime，~100MB+）
        # 时 light.exe 会失败且日志几乎无细节，阻断整平台。v0.6.x 发版也只发布 nsis。
        run: web/node_modules/.bin/tauri build --bundles nsis

      - name: Build Tauri App (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        # 只要 appimage/deb/rpm 三种安装包。createUpdaterArtifacts: true 会让 AppImage
        # 同时产 .sig（Tauri 2 官方支持 Linux updater，AppImage 是 updater 产物）。
        # deb/rpm 仅供手动安装，不参与 updater。
        run: web/node_modules/.bin/tauri build --bundles appimage,deb,rpm

      # ── 收集产物到 release-assets/ ────────────────────────────────────────
      - name: Prepare macOS Assets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # updater 产物（.app.tar.gz + .sig）在 target 专属目录下；
          # 用 matrix.target 动态拼路径（带 --target 时为 target/<target>/release/...）。
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          echo "macOS bundle 目录: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR"
          # Tauri 2 原生 build 产出的 macOS tarball 文件名是 cc-partner.app.tar.gz（无架构后缀），
          # 双架构 matrix（aarch64 + x86_64）会产出同名文件互相覆盖。
          # 故按 matrix.target 重命名加架构后缀，让 latest.json 脚本能区分平台、避免覆盖。
          # 约定：aarch64-apple-darwin → aarch64；x86_64-apple-darwin → x64（对齐 latest.json key）
          ARCH="${{ matrix.target }}"
          case "$ARCH" in
            aarch64-*) ARCH_SHORT="aarch64";;
            x86_64-*)  ARCH_SHORT="x64";;
            *)         ARCH_SHORT="${ARCH%%-*}";;
          esac
          cp "$BUNDLE_DIR"/*.app.tar.gz "release-assets/cc-partner_${ARCH_SHORT}.app.tar.gz"
          cp "$BUNDLE_DIR"/*.app.tar.gz.sig "release-assets/cc-partner_${ARCH_SHORT}.app.tar.gz.sig"
          # 顺带收集 dmg 安装包（不参与 updater，仅供手动下载；同样加架构后缀避免覆盖）
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] || continue
            base=$(basename "$dmg")
            # 原文件名形如 cc-partner_0.6.6_aarch64.dmg 已含架构，保留原名
            cp "$dmg" "release-assets/$base"
          done
          echo "=== release-assets ==="
          ls -la release-assets/

      - name: Prepare Windows Assets
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          echo "Windows nsis bundle 目录: $NSIS_DIR"
          ls -la "$NSIS_DIR"
          # updater 首选 nsis 的 *_x64-setup.exe + 对应 .sig（Tauri 2 文件名用下划线分隔）
          # 强制要求签名（缺失即 fail）
          cp "$NSIS_DIR"/*_x64-setup.exe release-assets/
          cp "$NSIS_DIR"/*_x64-setup.exe.sig release-assets/
          if ! ls release-assets/*_x64-setup.exe.sig >/dev/null 2>&1; then
            echo "❌ 未找到 nsis setup.exe 的 .sig 签名文件，updater 无法工作" >&2
            exit 1
          fi
          echo "=== release-assets ==="
          ls -la release-assets/

      - name: Prepare Linux Assets
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          # updater 产物：AppImage + .sig（Tauri 2 官方支持，与 macOS/Windows 一致）
          cp "$APPIMAGE_DIR"/*.AppImage release-assets/
          cp "$APPIMAGE_DIR"/*.AppImage.sig release-assets/
          if ! ls release-assets/*.AppImage.sig >/dev/null 2>&1; then
            echo "❌ 未找到 AppImage 的 .sig 签名文件，updater 无法工作" >&2
            exit 1
          fi
          # deb / rpm 仅供手动安装，不参与 updater
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm release-assets/ 2>/dev/null || true
          echo "=== release-assets ==="
          ls -la release-assets/

      - name: Upload release artifacts to workflow
        # 每个 matrix job 一个独立 artifact（v4 不允许同名），publish-release 阶段合并
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.matrix_id }}
          path: release-assets/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # job 2: 汇总所有平台产物，上传到 GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all platform artifacts
        # merge-multiple 把所有匹配 release-assets-* 的 artifact 平铺到同一目录
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: List collected assets
        run: |
          echo "=== 合并后的 release-assets ==="
          ls -la release-assets/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            ## cc-partner ${{ github.ref_name }}

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Windows (x86_64) | `*_x64-setup.exe` |
            | Linux (x86_64) | `*_amd64.AppImage` / `.deb` |
            | Linux (ARM64) | `*_aarch64.AppImage` / `.deb` |

            ### 自动更新

            已安装旧版本的用户，应用内会自动检查更新（读取本 Release 的 `latest.json`）。
            macOS / Windows 支持应用内自动更新；Linux 需手动下载新版本安装包覆盖。
          files: release-assets/*

  # ─────────────────────────────────────────────────────────────────────────
  # job 3: 生成 latest.json 并上传到 Release（供应用内 updater 校验）
  # ─────────────────────────────────────────────────────────────────────────
  assemble-latest-json:
    name: Assemble latest.json
    needs: publish-release
    runs-on: ubuntu-22.04

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure gh CLI available
        # ubuntu runner 自带 gh，这里仅校验
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "❌ gh CLI 未安装" >&2
            exit 1
          fi
          gh --version

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl
          gh release download "$TAG" --dir dl --clobber
          echo "=== dl/ 内容 ==="
          ls -la dl/

      - name: Generate latest.json
        # 扫描所有 .sig，按文件名匹配平台。只把实际产出了签名文件的平台写进 latest.json，
        # 互不影响——这正是弃用 tauri-action 的核心：单平台缺签名不再拖累其他平台。
        # case 顺序：arch-specific 模式在前（aarch64/x64/amd64），避免被宽泛通配先吃掉。
        # 用 jq 构造 JSON，避免字符串拼接的引号/换行/缩进问题，顺带做合法性校验。
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="${GITHUB_REPOSITORY}"
          base_url="https://github.com/$REPO/releases/download/$TAG"

          mac_aarch64_url=""; mac_aarch64_sig=""
          mac_x64_url="";     mac_x64_sig=""
          win_x64_url="";     win_x64_sig=""
          linux_x64_url="";   linux_x64_sig=""
          linux_arm64_url=""; linux_arm64_sig=""

          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *_aarch64.app.tar.gz)
                mac_aarch64_url="$url"; mac_aarch64_sig="$sig_content";;
              *_x64.app.tar.gz)
                mac_x64_url="$url"; mac_x64_sig="$sig_content";;
              *_x64-setup.exe)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *_amd64.AppImage)
                linux_x64_url="$url"; linux_x64_sig="$sig_content";;
              *_aarch64.AppImage)
                linux_arm64_url="$url"; linux_arm64_sig="$sig_content";;
            esac
          done

          # 用 jq 构造 platforms 对象：先建全 5 个键，再用 with_entries 过滤掉 url 为空的
          # （jq 的 empty 在对象字面量里会吞掉整个对象，不能用 if-then-empty 写法）
          platforms_json=$(jq -n \
            --arg mac_a_url "$mac_aarch64_url"     --arg mac_a_sig "$mac_aarch64_sig" \
            --arg mac_x_url "$mac_x64_url"         --arg mac_x_sig "$mac_x64_sig" \
            --arg win_url  "$win_x64_url"          --arg win_sig  "$win_x64_sig" \
            --arg lx_url   "$linux_x64_url"        --arg lx_sig   "$linux_x64_sig" \
            --arg la_url   "$linux_arm64_url"      --arg la_sig   "$linux_arm64_sig" \
            '{
              "darwin-aarch64": {signature: $mac_a_sig, url: $mac_a_url},
              "darwin-x86_64":  {signature: $mac_x_sig, url: $mac_x_url},
              "windows-x86_64": {signature: $win_sig,  url: $win_url},
              "linux-x86_64":   {signature: $lx_sig,   url: $lx_url},
              "linux-aarch64":  {signature: $la_sig,   url: $la_url}
            } | with_entries(select(.value.url | length > 0))')

          platform_count=$(echo "$platforms_json" | jq '. | length')
          if [ "$platform_count" -eq 0 ]; then
            echo "❌ 没有任何平台产出 .sig 签名文件，无法生成 latest.json" >&2
            exit 1
          fi

          # 组装完整 latest.json 并用 jq 校验合法性
          jq -n \
            --arg version "$VERSION" \
            --arg notes "cc-partner $VERSION" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$platforms_json" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "=== latest.json ($platform_count 个平台) ==="
          cat latest.json

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
