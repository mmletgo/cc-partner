# CI — 日常质量门禁
#
# 触发：所有 PR 与推送 master。
# pull_request 不使用 paths-ignore：如果这些 job 是 branch protection 的 required checks，
# paths-ignore 会导致 docs-only PR 永久 pending（被跳过的 required workflow 保持 Pending）。
# push 到 master 时跳过纯文档/设计稿改动以节省 CI 额度。
# 单平台（ubuntu-22.04）三个独立 job 并行：
#   - quality：前端 lint + 构建、Rust fmt + clippy + 单测
#   - frontend-unit：Vitest 前端单测
#   - frontend-e2e：Playwright 端到端（chromium），失败上传 artifacts
# 严格门禁（任一 job 失败阻断合并），不使用 continue-on-error。
# 公开 macOS arm64/Windows/Linux 安装包在 push v* tag 时由 release-tauri.yml 构建；
# macOS 固定签名的统一 cc-partner 包仍仅手动触发 internal-macos.yml。

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'uiux/**'

# 同分支新推送取消旧的进行中 run，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint · Typecheck · Build · Clippy · Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          # 含 browser-runtime lock 版本，避免 managed Chromium/CDP 依赖与旧缓存混用
          shared-key: browser-runtime-150.0.7871.114

      - name: Browser runtime prepare self-test
        run: node scripts/prepare-browser-runtime.mjs --self-test

      - name: Install Linux build deps (Tauri 编译/clippy 依赖：webkit2gtk-4.1 等)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Frontend lint (ESLint)
        run: cd web && npm run lint

      - name: Frontend CSS token contract
        run: cd web && npm run check:tokens

      - name: Frontend i18n contract
        run: cd web && npm run check:i18n

      - name: Module boundary ratchet
        run: node scripts/check-module-boundaries.mjs

      - name: Quality matrix traceability (self-test + matrix)
        run: |
          node scripts/check-quality-traceability.mjs --self-test
          node scripts/check-quality-traceability.mjs

      - name: Agent Hub support manifest contract
        run: |
          node scripts/check-agent-hub-support-manifest.mjs --self-test
          node scripts/check-agent-hub-support-manifest.mjs --gate-b

      - name: Frontend build (tsc 类型检查 + vite build)
        run: cd web && npm run build

      - name: Frontend bundle contract (initial/lazy/total/sourcemap budgets + mobile forbidden deps)
        run: cd web && npm run check:bundle

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Gate B Task 4：从 support-manifest 读取 pinned min/current 版本。
      # 无 reproducible installer 的 target 保持 write=Blocked，本 job 只打印版本并确认
      # 非 ignored 合同 harness 编译；不把“本地碰巧装了 CLI”提升为 L3 PASS。
      - name: Agent Hub support unit + CLI contract compile
        working-directory: src-tauri
        run: |
          cargo test --locked agent_hub::support --lib
          cargo test --locked --test agent_hub_cli_contract
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('../src-tauri/src/agent_hub/support/support-manifest.json','utf8'));
            for (const t of m.targets) {
              console.log(
                'pinned', t.target,
                'min=' + t.minTestedVersion,
                'current=' + t.currentTestedVersion,
                'writeCaps=' + Object.entries(t.capabilities||{})
                  .filter(([k,v]) => /render|activate|deactivate|liveReload/i.test(k))
                  .map(([k,v]) => k+':'+v).join(',')
              );
            }
            console.log('NOTE: ignored L3 contract tests require CC_PARTNER_L3_TARGET + installed CLI; not executed here');
          "

  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Frontend unit tests (Vitest)
        run: cd web && npm test

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Install Playwright browser (chromium)
        run: cd web && npm exec -- playwright install --with-deps chromium

      - name: Frontend E2E tests (Playwright)
        run: cd web && npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/test-results/**
            web/playwright-report/**
          retention-days: 7
