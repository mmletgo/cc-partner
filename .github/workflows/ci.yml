# CI — 日常质量门禁
#
# 触发：所有 PR 与推送 master。
# pull_request 不使用 paths-ignore：如果这些 job 是 branch protection 的 required checks，
# paths-ignore 会导致 docs-only PR 永久 pending（被跳过的 required workflow 保持 Pending）。
# push 到 master 时跳过纯文档/设计稿改动以节省 CI 额度。
# 单平台（ubuntu-22.04）三个独立 job 并行：
#   - quality：前端 lint + 构建、Rust fmt + clippy + 单测
#   - frontend-unit：Vitest 前端单测
#   - frontend-e2e：Playwright 端到端（chromium），失败上传 artifacts
# 严格门禁（任一 job 失败阻断合并），不使用 continue-on-error。
# 三平台完整安装包打包仅在 push v* tag 发版时跑，见 release-tauri.yml。

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'uiux/**'

# 同分支新推送取消旧的进行中 run，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint · Typecheck · Build · Clippy · Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build deps (Tauri 编译/clippy 依赖：webkit2gtk-4.1 等)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Frontend lint (ESLint)
        run: cd web && npm run lint

      - name: Frontend CSS token contract
        run: cd web && npm run check:css-tokens

      - name: Frontend build (tsc 类型检查 + vite build)
        run: cd web && npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Frontend unit tests (Vitest)
        run: cd web && npm test

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Install Playwright browser (chromium)
        run: cd web && npm exec -- playwright install --with-deps chromium

      - name: Frontend E2E tests (Playwright)
        run: cd web && npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/test-results/**
            web/playwright-report/**
          retention-days: 7
